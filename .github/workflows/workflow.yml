name: Waka Readme

on:
  schedule:
    # 04:17 UTC, about midnight Eastern. Off the hour because top-of-hour schedules queue the longest.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waka-readme

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_API_URL: ${{ secrets.WAKATIME_API_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE: True
          SHOW_PROFILE_VIEWS: False
          SHOW_OS: False
          SHOW_PROJECTS: False
          SHOW_TIMEZONE: False
          SHOW_LOC_CHART: False
          # Wakapi doesn't return the AI fields these two read.
          SHOW_AI_CODING: False
          SHOW_AI_CODE_TIME: False
          UPDATED_DATE_FORMAT: "%b %d, %Y %H:%M"
          IGNORED_REPOS: "fob, web-frontend"
